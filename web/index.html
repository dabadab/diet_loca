<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet log</title>
<link rel="stylesheet" href="/static/fonts.css">
<style>
  :root {
    --paper: #F6F1E4;
    --paper-line: #DCD4BC;
    --ink: #2B2A24;
    --ink-soft: #6B6553;
    --tomato: #B5452B;
    --leaf: #4A6B3D;
    --leaf-dark: #33492A;
    --butter: #E3B23C;
    --card: #FFFDF6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image: repeating-linear-gradient(var(--paper-line) 0 1px, transparent 1px 32px);
    color: var(--ink);
    font-family: 'Karla', 'Segoe UI', system-ui, sans-serif;
    padding: 28px 16px 60px;
  }

  /* Wide enough for the day list beside the day itself; the other views keep a
     reading width so they are not stretched across a desktop monitor. */
  .wrap { max-width: 1160px; margin: 0 auto; }
  /* A reading width, but starting at the left edge like the day view --
     centring these made the three tabs sit in different places. */
  #rollupView, #systemView, #gate { max-width: 760px; margin: 0; }
  header, .mode-tabs, .foot-note { max-width: 1160px; }

  /* Master-detail when there is room, stacked when there is not. */
  .day-grid { display: grid; gap: 20px; }
  .day-grid > * { min-width: 0; }
  @media (min-width: 1040px) {
    .day-grid { grid-template-columns: minmax(0, 560px) minmax(0, 1fr); align-items: start; }
    /* The list is long; keep the selected day in view while scrolling it. */
    .day-grid .day-detail { position: sticky; top: 20px; }
    .day-grid table.days td, .day-grid table.days th { padding-left: 9px; }
    .day-grid table.days td { font-size: 0.8rem; }
    .day-grid table.days th { font-size: 0.66rem; }
    .day-grid td.date { font-size: 0.84rem; }
  }
  @media (max-width: 1039px) {
    /* Stacked: the day itself first, the list under it. */
    .day-grid .day-detail { order: -1; }
  }
  @media (max-width: 760px) {
    .wrap, header, .mode-tabs, .foot-note { max-width: 720px; }
  }

  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 3px solid var(--ink); padding-bottom: 14px; margin-bottom: 20px;
    gap: 16px; flex-wrap: wrap;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 2rem;
    margin: 0; letter-spacing: -0.01em;
  }

  .goal-line {
    text-align: right; font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.8rem; color: var(--ink-soft); line-height: 1.7;
  }
  .goal-line b { color: var(--ink); font-weight: 600; }
  .goal-line input {
    font: inherit; font-weight: 600; color: var(--ink); width: 5ch;
    background: transparent; border: none; border-bottom: 1px dashed var(--ink-soft);
    text-align: right; padding: 0 2px; appearance: textfield; -moz-appearance: textfield;
  }
  .goal-line input::-webkit-outer-spin-button,
  .goal-line input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .goal-line input:focus { outline: none; border-bottom-style: solid; }
  .who button {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.76rem;
    background: none; border: none; color: var(--tomato); cursor: pointer;
    padding: 0; text-decoration: underline;
  }

  .mode-tabs {
    display: flex; margin-bottom: 16px; border: 1.5px solid var(--ink);
    border-radius: 4px; overflow: hidden; width: fit-content;
  }
  .mode-tab {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.78rem;
    padding: 8px 16px; border: none; background: var(--card); color: var(--ink);
    cursor: pointer; border-right: 1.5px solid var(--ink);
  }
  .mode-tab:last-child { border-right: none; }
  .mode-tab.active { background: var(--leaf-dark); color: var(--card); }

  .summary, .block-card {
    background: var(--card); border: 1.5px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink); padding: 20px 22px; margin-bottom: 18px;
  }

  .summary-top, .block-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 16px; gap: 12px;
  }
  .summary-top h2, .block-title h2 {
    font-family: 'Fraunces', Georgia, serif; font-size: 1.3rem; margin: 0; font-weight: 600;
  }
  .block-title h2 { font-size: 1.15rem; }
  .block-title .sub, .avg-line {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.74rem; color: var(--ink-soft);
  }
  .avg-line { margin-top: 4px; }

  .status-pill {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.72rem;
    padding: 3px 9px; border-radius: 10px; border: 1px solid var(--ink); white-space: nowrap;
  }
  .status-pill.estimated { color: var(--tomato); border-color: var(--tomato); }
  .status-pill.measured  { color: var(--leaf-dark); border-color: var(--leaf-dark); }
  .status-pill.ok    { color: var(--leaf-dark); border-color: var(--leaf-dark); }
  .status-pill.stale { color: var(--butter); border-color: var(--butter); }
  .status-pill.down  { color: var(--tomato); border-color: var(--tomato); }

  .metric { margin-bottom: 14px; }
  .metric-label {
    display: flex; justify-content: space-between;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.82rem; margin-bottom: 6px;
  }
  .metric-label .name { color: var(--ink-soft); }
  .metric-label .value { font-weight: 600; }

  .bar-track {
    height: 12px; background: var(--paper); border: 1px solid var(--ink);
    border-radius: 7px; overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 7px 0 0 7px; transition: width 0.4s ease; }
  .bar-fill.kcal { background: var(--butter); }
  .bar-fill.protein { background: var(--leaf); }
  .bar-fill.over { background: var(--tomato); }

  .expenditure-row {
    display: flex; align-items: center; gap: 10px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.82rem;
    margin-bottom: 14px; padding: 10px 12px; background: var(--paper);
    border: 1px dashed var(--ink-soft); border-radius: 4px; flex-wrap: wrap;
  }
  .expenditure-row .label { color: var(--ink-soft); flex: 1; }
  .expenditure-row .figure { font-weight: 600; }

  .balance-line {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.78rem; color: var(--ink-soft);
  }
  .balance-line .value { color: var(--ink); font-weight: 600; }
  .balance-line .deficit { color: var(--leaf-dark); font-weight: 600; }
  .balance-line .surplus { color: var(--tomato); font-weight: 600; }

  .stat-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px;
  }
  .stat {
    background: var(--paper); border: 1px dashed var(--ink-soft); border-radius: 4px;
    padding: 10px 12px;
  }
  .stat-label {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.7rem;
    color: var(--ink-soft); margin-bottom: 4px;
  }
  .stat-value {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 1.15rem;
    font-weight: 600; line-height: 1.2;
  }
  .stat-unit { font-size: 0.7rem; font-weight: 400; color: var(--ink-soft); }
  .stat-note {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.66rem;
    color: var(--ink-soft); margin-top: 3px;
  }
  @media (max-width: 520px) { .stat-row { grid-template-columns: 1fr; } }

  .table-wrap { overflow-x: auto; }
  table.days { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  table.days th {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.72rem;
    font-weight: 500; color: var(--ink-soft); text-align: right; white-space: nowrap;
    padding: 0 0 8px 14px; border-bottom: 1.5px solid var(--ink);
  }
  table.days th:first-child, table.days td:first-child { text-align: left; padding-left: 0; }
  table.days td {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.85rem;
    text-align: right; white-space: nowrap; padding: 9px 0 9px 14px;
    border-bottom: 1px dotted var(--paper-line);
  }
  table.days tr:last-child td { border-bottom: none; }
  table.days tbody tr.day-row { cursor: pointer; }
  table.days tbody tr.day-row:hover td { background: var(--paper); }
  table.days tr.today td { font-weight: 600; }
  table.days tr.day-row.active td { background: var(--paper); }
  table.days tr.day-row.active td.date { font-weight: 700; }
  table.days tr.day-row.active td:first-child { box-shadow: inset 3px 0 0 var(--leaf-dark); }
  td.date { font-family: 'Karla', sans-serif; font-size: 0.9rem; padding-left: 10px; }
  .est { border-bottom: 1px dotted var(--ink-soft); }
  .partial { border-bottom: 1px dotted var(--butter); }
  .neg { color: var(--leaf-dark); font-weight: 600; }
  .pos { color: var(--tomato); font-weight: 600; }
  .muted { color: var(--ink-soft); }
  .meal-line {
    display: flex; justify-content: space-between; gap: 12px; padding: 5px 0;
    font-family: 'Karla', sans-serif; font-size: 0.88rem; text-align: left;
  }
  .meal-line .nums {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.78rem;
    color: var(--ink-soft); white-space: nowrap;
  }
  .meal-items {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.72rem;
    color: var(--ink-soft); padding-left: 12px; border-left: 2px solid var(--paper-line);
    margin: 2px 0 6px; text-align: left;
  }

  .entries { margin-top: 18px; }
  .entries h3 {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.78rem;
    color: var(--ink-soft); margin: 0 0 8px; font-weight: 500;
  }

  .empty-note { color: var(--ink-soft); font-size: 0.88rem; font-style: italic; padding: 6px 0; }

  /* system / chain */
  .chain { list-style: none; margin: 0; padding: 0; }
  .chain li {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 10px 0; border-bottom: 1px dotted var(--paper-line);
  }
  .chain li:last-child { border-bottom: none; }
  .chain .stage-name { font-weight: 500; }
  .chain .stage-detail {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.76rem;
    color: var(--ink-soft); display: block; margin-top: 2px;
  }
  /* Bordered cells rather than a gap-coloured grid: an incomplete last row
     otherwise leaves a filled block where a cell would have been. */
  .facts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 8px; margin-top: 14px;
  }
  .fact {
    background: var(--paper); border: 1px solid var(--paper-line);
    border-radius: 3px; padding: 8px 11px;
  }
  .fact-label {
    display: block; font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.66rem; letter-spacing: .06em; color: var(--ink-soft); margin-bottom: 2px;
  }
  .fact-value {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.86rem; font-weight: 600;
  }
  .fact-value.bad { color: var(--tomato); }
  .action {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.76rem;
    background: var(--paper); border: 1px dashed var(--ink-soft); border-radius: 4px;
    padding: 8px 11px; margin-top: 10px; color: var(--ink-soft); overflow-wrap: anywhere;
  }
  .action.bad { border-color: var(--tomato); color: var(--tomato); }

  /* sign in */
  form.login { display: grid; gap: 0.7rem; max-width: 21rem; }
  label.field { display: grid; gap: 0.2rem; font-family: 'IBM Plex Mono', ui-monospace, monospace;
                font-size: 0.76rem; color: var(--ink-soft); }
  label.field input {
    font-family: 'Karla', sans-serif; font-size: 0.9rem; padding: 9px 10px;
    border: 1.5px solid var(--ink); border-radius: 3px; background: var(--paper); color: var(--ink);
  }
  button.primary {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; font-size: 0.85rem;
    background: var(--leaf-dark); color: var(--card); border: none; border-radius: 3px;
    cursor: pointer; padding: 10px 16px;
  }
  button.primary:hover:not(:disabled) { background: var(--leaf); }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  .err { color: var(--tomato); font-size: 0.82rem; min-height: 1.2em;
         font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .foot-note {
    font-size: 0.74rem; color: var(--ink-soft); margin-top: 26px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
  }

  @media (max-width: 480px) {
    header { align-items: flex-start; }
    .goal-line { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Diet log</h1>
    <div class="goal-line" id="goalLine"></div>
  </header>

  <div id="gate" hidden></div>

  <div id="main" hidden>
    <div class="mode-tabs" id="modeTabs"></div>
    <div id="dayView"></div>
    <div id="rollupView" hidden></div>
    <div id="systemView" hidden></div>
  </div>

  <div class="foot-note" id="foot"></div>
</div>

<script>
"use strict";

// Identity is the session cookie. No endpoint takes a user id.
const GOALS_KEY = "diet-log-goals";
const WINDOW_DAYS = 28;

let state = {
  mode: "days",
  days: [],          // newest first, from /api/days
  activeDate: null,      // the day shown in full
  detail: {},        // date -> /api/day payload
  me: null,
  goals: { kcal: 1800, protein: 150 },
};

// --- plumbing --------------------------------------------------------------

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { Accept: "application/json", ...(options.headers || {}) },
  });
  let body = null;
  try { body = await res.json(); } catch (_) {}
  if (!res.ok) {
    throw Object.assign(new Error(body?.error || `${path} returned ${res.status}`),
                        { code: res.status });
  }
  return body;
}

const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n0 = (v) => v == null ? "—" : Math.round(v).toLocaleString();
const n1 = (v) => v == null ? "—" : Number(v).toFixed(1);

function loadGoals() {
  try {
    const raw = localStorage.getItem(GOALS_KEY);
    if (raw) state.goals = { ...state.goals, ...JSON.parse(raw) };
  } catch (_) { /* private mode, or nothing stored */ }
}
function saveGoals() {
  try { localStorage.setItem(GOALS_KEY, JSON.stringify(state.goals)); } catch (_) {}
}

// --- pieces ----------------------------------------------------------------

function bar(label, value, goal, cls, unit) {
  const known = value != null;
  const pct = known && goal > 0 ? Math.min(100, (value / goal) * 100) : 0;
  const over = known && value > goal;
  const shown = unit === "kcal" ? n0(value) : n1(value);
  return `
    <div class="metric">
      <div class="metric-label">
        <span class="name">${esc(label)}</span>
        <span class="value">${shown} / ${unit === "kcal" ? n0(goal) : n1(goal)} ${unit}</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${over ? "over" : cls}" style="width:${pct}%"></div></div>
    </div>`;
}

function balanceLine(intake, expenditure, opts = {}) {
  if (intake == null || expenditure == null) {
    return `<div class="balance-line">energy balance: <span class="value">—</span>
      ${expenditure == null ? "(no expenditure synced for this day)" : "(nothing logged)"}</div>`;
  }
  const diff = intake - expenditure;
  const cls = diff < 0 ? "deficit" : "surplus";
  const word = diff < 0 ? "deficit" : "surplus";
  return `<div class="balance-line">energy balance: intake ${n0(intake)} kcal −
    expenditure ${n0(expenditure)} kcal =
    <span class="${cls}">${diff > 0 ? "+" : ""}${n0(diff)} kcal</span> (${word})
    ${opts.partial ? '<br><span style="opacity:.75">expenditure is active calories only; the whole-day total has not synced</span>' : ""}
    ${opts.note || ""}</div>`;
}

function renderGoalLine() {
  const box = el("goalLine");
  if (!state.me) { box.textContent = ""; return; }
  box.innerHTML = `
    <div class="who">signed in as <b>${esc(state.me.display_name)}</b> ·
      <button id="signOut">sign out</button></div>
    <div>target <input id="goalKcal" type="number" min="0" step="10" value="${state.goals.kcal}"> kcal ·
      <input id="goalProtein" type="number" min="0" step="5" value="${state.goals.protein}"> g protein</div>`;
  el("signOut").onclick = async () => {
    await api("/api/logout", { method: "POST" }).catch(() => {});
    location.reload();
  };
  for (const [id, key] of [["goalKcal", "kcal"], ["goalProtein", "protein"]]) {
    el(id).addEventListener("change", (ev) => {
      const v = parseFloat(ev.target.value);
      if (!isNaN(v) && v >= 0) { state.goals[key] = v; saveGoals(); render(); }
    });
  }
}

function renderModeTabs() {
  const modes = [["days", "Days"], ["rollup", "Summary"], ["system", "System"]];
  el("modeTabs").innerHTML = "";
  for (const [id, label] of modes) {
    const b = document.createElement("button");
    b.className = "mode-tab" + (state.mode === id ? " active" : "");
    b.textContent = label;
    b.onclick = () => { state.mode = id; render(); };
    el("modeTabs").append(b);
  }
  el("dayView").hidden = state.mode !== "days";
  el("rollupView").hidden = state.mode !== "rollup";
  el("systemView").hidden = state.mode !== "system";
}

// The day list: every day in the window on one screen with its own totals,
// which is the view that actually answers "how am I doing". A row expands to
// the meals behind its numbers.
// The day display: the selected day in full, with a vertical list of every day
// and its own totals underneath to move between them.
function renderDays() {
  const box = el("dayView");
  if (!state.days.length) {
    box.innerHTML = `<div class="summary"><div class="empty-note">
      No days recorded yet. Log a meal through Claude, or run the Garmin sync,
      and the first day appears here.</div></div>`;
    return;
  }
  if (!state.activeDate || !state.days.some((d) => d.date === state.activeDate)) {
    state.activeDate = state.days[0].date;
  }
  box.innerHTML = `<div class="day-grid">${dayListCard()}${dayCard()}</div>`;

  box.querySelectorAll("tr.day-row").forEach((tr) => {
    tr.addEventListener("click", () => {
      state.activeDate = tr.dataset.date;
      renderDays();
      // Only worth scrolling when the day sits below the list rather than beside it.
      if (window.matchMedia("(max-width: 1039px)").matches) {
        el("dayView").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  });
}

function dayCard() {
  const d = state.days.find((x) => x.date === state.activeDate);
  const dt = new Date(d.date + "T12:00:00");
  const heading = dt.toLocaleDateString(undefined,
    { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  const pill = d.intake_source
    ? `<span class="status-pill ${d.intake_source === "claude-estimate" ? "estimated" : "measured"}">${
        d.intake_source === "claude-estimate" ? "intake estimated" : "intake measured"}</span>`
    : `<span class="status-pill">nothing logged</span>`;

  const detail = state.detail[d.date];
  if (!detail) loadDetail(d.date);

  return `
    <div class="summary day-detail">
      <div class="summary-top"><h2>${esc(heading)}</h2>${pill}</div>

      <div class="expenditure-row">
        <span class="label">measured expenditure (Garmin)</span>
        <span class="figure">${n0(d.energy_out_kcal)} kcal</span>
        ${d.weight_kg != null ? `<span class="label" style="flex:0 0 auto">· weight</span>
          <span class="figure">${n1(d.weight_kg)} kg</span>` : ""}
      </div>

      ${balanceLine(d.energy_in_kcal, d.energy_out_kcal, { partial: d.energy_out_partial })}
      <div style="height:16px"></div>

      ${bar("calories", d.energy_in_kcal, state.goals.kcal, "kcal", "kcal")}
      ${bar("protein", d.protein_g, state.goals.protein, "protein", "g")}
      ${(d.carb_g != null || d.fat_g != null)
        ? `<div class="avg-line">carbs ${n1(d.carb_g)} g · fat ${n1(d.fat_g)} g</div>` : ""}

      <div class="entries">
        <h3>Meals${d.meals_logged ? ` (${d.meals_logged})` : ""}</h3>
        ${detail == null ? '<div class="empty-note">Loading…</div>' : mealsHtml(detail)}
      </div>
      <div class="avg-line" style="margin-top:14px">
        Meals are logged by describing them to Claude, which writes them here.
      </div>
    </div>`;
}

function mealsHtml(detail) {
  if (!detail.meals.length) return '<div class="empty-note">Nothing logged on this day.</div>';
  return detail.meals.map((m) => {
    const when = new Date(m.eaten_at).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    const protein = (m.items || []).reduce((a, i) => a + Number(i.protein_g || 0), 0);
    const items = (m.items || []).map((i) =>
      `${esc(i.food)} — ${n0(i.kcal)} kcal${i.grams != null ? `, ${n0(i.grams)} g` : ""}${
        i.protein_g != null ? `, ${n1(i.protein_g)} g protein` : ""}`).join("<br>");
    return `
      <div class="meal-line">
        <span>${esc(m.description)}</span>
        <span class="nums">${when} · ${n0(m.kcal)} kcal · ${n1(protein)} g</span>
      </div>
      <div class="meal-items">${items || "no breakdown recorded"}</div>`;
  }).join("");
}

function dayListCard() {
  const today = state.days[0].date;
  const rows = state.days.map((d) => {
    const known = d.energy_in_kcal != null && d.energy_out_kcal != null;
    const bal = known ? d.energy_in_kcal - d.energy_out_kcal : null;
    const inCell = d.energy_in_kcal == null ? '<span class="muted">—</span>'
      : `<span class="${d.intake_source === "claude-estimate" ? "est" : ""}">${n0(d.energy_in_kcal)}</span>`;
    const outCell = d.energy_out_kcal == null ? '<span class="muted">—</span>'
      : d.energy_out_partial
        ? `<span class="partial" title="active calories only">${n0(d.energy_out_kcal)}</span>`
        : n0(d.energy_out_kcal);
    const dt = new Date(d.date + "T12:00:00");
    const label = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    return `
      <tr class="day-row${d.date === state.activeDate ? " active" : ""}${d.date === today ? " today" : ""}"
          data-date="${d.date}">
        <td class="date">${esc(label)}${d.date === today ? " · today" : ""}</td>
        <td>${inCell}</td>
        <td>${d.protein_g == null ? '<span class="muted">—</span>' : n1(d.protein_g)}</td>
        <td>${outCell}</td>
        <td class="${bal == null ? "muted" : bal < 0 ? "neg" : "pos"}">${
          bal == null ? "—" : (bal > 0 ? "+" : "") + n0(bal)}</td>
        <td>${d.weight_kg == null ? '<span class="muted">—</span>' : n1(d.weight_kg)}</td>
        <td>${d.meals_logged || '<span class="muted">—</span>'}</td>
      </tr>`;
  }).join("");

  return `
    <div class="summary day-list">
      <div class="summary-top"><h2>All days</h2>
        <span class="sub">${state.days.length} days · newest first</span></div>
      <div class="table-wrap">
        <table class="days">
          <thead><tr>
            <th>Date</th><th>In</th><th>Protein</th><th>Out</th>
            <th>Balance</th><th>Weight</th><th>Meals</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="avg-line" style="margin-top:14px">
        kcal in / g protein / kcal out / balance / kg. Underlined intake is estimated
        from a description. Pick a day to see it in full.
      </div>
    </div>`;
}

const inFlight = new Set();

async function loadDetail(date) {
  if (inFlight.has(date)) return;
  inFlight.add(date);
  try {
    state.detail[date] = await api(`/api/day/${date}`);
  } catch (err) {
    state.detail[date] = { meals: [], measurements: [], error: err.message };
  }
  inFlight.delete(date);
  if (state.mode === "days") renderDays();
}

// --- summary ---------------------------------------------------------------

// Days where Garmin synced but nothing was eaten are not zero-calorie days --
// they are days with no intake. Averaging them in invents a deficit, so each
// figure is averaged over only the days that actually carry it, and the counts
// are shown.
function statsFor(list) {
  const add = (xs, k) => xs.reduce((a, d) => a + (d[k] || 0), 0);
  const withIntake = list.filter((d) => d.energy_in_kcal != null);
  const withOut = list.filter((d) => d.energy_out_kcal != null);
  const both = list.filter((d) => d.energy_in_kcal != null && d.energy_out_kcal != null);
  return {
    n: list.length,
    intakeDays: withIntake.length,
    kcal: add(withIntake, "energy_in_kcal"),
    protein: add(withIntake, "protein_g"),
    outDays: withOut.length,
    out: add(withOut, "energy_out_kcal"),
    bothDays: both.length,
    balance: add(both, "energy_in_kcal") - add(both, "energy_out_kcal"),
  };
}

function stat(label, value, unit, days, cls) {
  const days_ = `over ${days} day${days === 1 ? "" : "s"}`;
  return `
    <div class="stat">
      <div class="stat-label">${label}</div>
      <div class="stat-value ${cls || ""}">${value == null ? "—" : (unit === "g" ? n1(value) : n0(value))}
        <span class="stat-unit">${value == null ? "" : unit}</span></div>
      <div class="stat-note">${value == null ? "no data" : days_}</div>
    </div>`;
}

function avgRow(st) {
  const kcalAvg = st.intakeDays ? st.kcal / st.intakeDays : null;
  const proteinAvg = st.intakeDays ? st.protein / st.intakeDays : null;
  const balAvg = st.bothDays ? st.balance / st.bothDays : null;
  // "avg deficit −448" reads as a double negative. Name the direction instead
  // and show the size, so the number always means what the label says.
  const balLabel = balAvg == null ? "avg balance" : balAvg <= 0 ? "avg deficit" : "avg surplus";
  return `<div class="stat-row">
    ${stat("avg intake", kcalAvg, "kcal", st.intakeDays)}
    ${stat("avg protein", proteinAvg, "g", st.intakeDays)}
    ${stat(balLabel, balAvg == null ? null : Math.abs(balAvg), "kcal", st.bothDays,
           balAvg == null ? "" : balAvg <= 0 ? "neg" : "pos")}
  </div>`;
}

function statsBlock(st) {
  if (!st.intakeDays && !st.bothDays) {
    return `<div class="empty-note">No meals logged${
      st.outDays ? ` — expenditure synced for ${st.outDays} of ${st.n} days` : ""}.</div>`;
  }
  const d = st.intakeDays;
  return `
    ${avgRow(st)}
    ${d ? `
      ${bar("calories, total", st.kcal, state.goals.kcal * d, "kcal", "kcal")}
      ${bar("protein, total", st.protein, state.goals.protein * d, "protein", "g")}
      <div class="avg-line">totals and bars cover the ${d} of ${st.n} day${st.n === 1 ? "" : "s"} with meals logged</div>
    ` : ""}
    ${st.bothDays ? `<div class="balance-line" style="margin-top:12px">
      total ${st.balance <= 0 ? "deficit" : "surplus"} over ${st.bothDays} day${st.bothDays === 1 ? "" : "s"}
      with both figures:
      <span class="${st.balance <= 0 ? "neg" : "pos"}">${n0(Math.abs(st.balance))} kcal</span>
      </div>` : ""}`;
}

function renderRollup() {
  const box = el("rollupView");
  // Today is a partial day: dinner is not eaten yet and Garmin has not finished
  // accumulating expenditure. Averaging it in drags every figure down and makes
  // the deficit look better than it is, so summaries cover complete days only.
  const today = state.days.length ? state.days[0].date : null;
  const hasData = (d) => d.meals_logged > 0 || d.energy_out_kcal != null;
  const recorded = state.days.filter((d) => d.date !== today && hasData(d));
  if (!recorded.length) {
    const onlyToday = state.days.some((d) => d.date === today && hasData(d));
    box.innerHTML = `<div class="block-card"><div class="empty-note">${
      onlyToday
        ? "Only today has anything recorded, and today is not counted until it is complete."
        : "Nothing recorded yet."}</div></div>`;
    return;
  }
  const asc = [...recorded].reverse();
  const weeks = [];
  for (let i = 0; i < asc.length; i += 7) weeks.push(asc.slice(i, i + 7));

  const weekCards = weeks.map((week, wi) => {
    const st = statsFor(week);
    const weights = week.filter((d) => d.weight_kg != null);
    return `
      <div class="block-card">
        <div class="block-title">
          <h2>Week ${wi + 1}</h2>
          <span class="sub">${week[0].date} – ${week[week.length - 1].date} · ${st.n} day${st.n === 1 ? "" : "s"}</span>
        </div>
        ${statsBlock(st)}
        ${weights.length >= 2 ? `<div class="avg-line" style="margin-top:8px">
          weight ${n1(weights[0].weight_kg)} kg → ${n1(weights[weights.length - 1].weight_kg)} kg</div>` : ""}
      </div>`;
  }).join("");

  const all = statsFor(recorded);
  const withIntake = recorded.filter((d) => d.energy_in_kcal != null);
  const overKcal = withIntake.filter((d) => d.energy_in_kcal > state.goals.kcal).length;
  const hitProtein = withIntake.filter((d) => (d.protein_g || 0) >= state.goals.protein).length;
  const weights = recorded.filter((d) => d.weight_kg != null);

  box.innerHTML = `
    <div class="block-card">
      <div class="block-title"><h2>Complete days</h2>
        <span class="sub">${all.n} days · ${all.intakeDays} with meals · today excluded</span></div>
      ${statsBlock(all)}
      ${all.intakeDays ? `<div class="avg-line" style="margin-top:12px">
        calorie target exceeded on ${overKcal} of ${all.intakeDays} logged days ·
        protein target met on ${hitProtein} of ${all.intakeDays}</div>` : ""}
      ${weights.length >= 2 ? `<div class="avg-line">
        weight ${n1(weights[weights.length - 1].weight_kg)} kg → ${n1(weights[0].weight_kg)} kg
        over ${weights.length} weigh-ins</div>` : ""}
    </div>
    ${weekCards}`;
}

async function renderSystem() {
  const box = el("systemView");
  box.innerHTML = `<div class="block-card"><div class="empty-note">Checking…</div></div>`;
  const t0 = performance.now();
  let data;
  try {
    data = await api("/api/status");
  } catch (err) {
    box.innerHTML = `<div class="block-card">
      <div class="block-title"><h2>The API did not answer</h2></div>
      <div class="empty-note">${esc(err.message)}. The page is being served, so check that
      the app container is running and that nginx proxies to it.</div></div>`;
    return;
  }

  const chain = `
    <div class="block-card">
      <div class="block-title">
        <h2>Where the data comes from</h2>
        <span class="sub">round trip ${Math.round(performance.now() - t0)} ms</span>
      </div>
      <ul class="chain">
        ${data.stages.map((s) => `
          <li>
            <span>
              <span class="stage-name">${esc(s.stage)}</span>
              <span class="stage-detail">${esc(s.detail)}</span>
            </span>
            <span class="status-pill ${esc(s.state)}">${esc(s.state)}</span>
          </li>`).join("")}
      </ul>
    </div>`;

  box.innerHTML = chain + garminCard(data.diagnostics);
}

// The three ways a Garmin sync fails are indistinguishable from the outside --
// no stored session, a poller that never runs, a poller that runs and fails --
// and a fourth looks like success while nothing new arrives. This names which.
function garminCard(diag) {
  if (!diag || !diag.garmin) {
    return `<div class="block-card">
      <div class="block-title"><h2>Garmin</h2></div>
      <div class="empty-note">Diagnostics unavailable — the database did not answer.</div>
    </div>`;
  }
  const g = diag.garmin, v = diag.garmin_verdict;

  const fact = (label, value, cls) =>
    `<div class="fact"><span class="fact-label">${label}</span>
       <span class="fact-value ${cls || ""}">${value}</span></div>`;

  const rows = g.metrics.length ? `
    <div class="table-wrap" style="margin-top:14px">
      <table class="days">
        <thead><tr><th>Metric</th><th>Last seen</th><th>Latest</th><th>Readings</th></tr></thead>
        <tbody>${g.metrics.map((m) => `
          <tr><td class="date" style="padding-left:0">${esc(m.metric)}</td>
              <td>${esc(m.last_seen)}</td>
              <td>${m.latest == null ? "—" : `${n1(m.latest)} ${esc(m.unit || "")}`}</td>
              <td>${m.n}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>` : '<div class="empty-note">No Garmin readings stored at all.</div>';

  return `
    <div class="block-card">
      <div class="block-title">
        <h2>Garmin</h2>
        <span class="status-pill ${esc(v.state)}">${esc(v.state)}</span>
      </div>
      <p style="margin:0 0 4px">${esc(v.summary)}</p>
      ${v.action ? `<div class="action">${esc(v.action)}</div>` : ""}

      <div class="facts">
        ${fact("session stored", g.credential
            ? `yes · ${esc(g.credential.stored_at.slice(0, 10))}`
            : "no", g.credential ? "" : "bad")}
        ${fact("last attempt", g.last_attempt_at ? esc(ago(g.last_attempt_at)) : "never",
               g.last_attempt_at ? "" : "bad")}
        ${fact("last success", g.last_success_at ? esc(ago(g.last_success_at)) : "never",
               g.last_success_at ? "" : "bad")}
        ${fact("newest reading", g.newest_reading ? esc(g.newest_reading) : "—")}
        ${fact("readings, 7 days", g.readings_last_7_days,
               g.readings_last_7_days ? "" : "bad")}
        ${fact("readings, total", g.readings_total)}
      </div>

      ${g.last_error ? `<div class="action bad" style="margin-top:12px">
        last error: ${esc(g.last_error)}</div>` : ""}

      ${rows}

      ${g.metrics_never_seen.length ? `<div class="avg-line" style="margin-top:10px">
        never seen: ${g.metrics_never_seen.map(esc).join(", ")} —
        body_fat_pct needs a scale that measures impedance, so its absence is normal;
        anything else missing suggests the field moved and
        <code>DAILY_SPECS</code> in app/garmin.py needs correcting.</div>` : ""}
    </div>`;
}

function ago(iso) {
  const secs = (Date.now() - new Date(iso).getTime()) / 1000;
  for (const [unit, size] of [["day", 86400], ["hour", 3600], ["minute", 60]]) {
    if (secs >= size) {
      const n = Math.floor(secs / size);
      return `${n} ${unit}${n === 1 ? "" : "s"} ago`;
    }
  }
  return "just now";
}

// --- sign in ---------------------------------------------------------------

function showLogin(message) {
  el("main").hidden = true;
  el("goalLine").textContent = "";
  const gate = el("gate");
  gate.hidden = false;
  gate.innerHTML = `
    <div class="summary" style="max-width:26rem">
      <div class="summary-top"><h2>Sign in</h2></div>
      <form class="login" id="loginForm">
        <label class="field">email<input type="email" name="email" autocomplete="username" required></label>
        <label class="field">password<input type="password" name="password" autocomplete="current-password" required></label>
        <div class="err" id="loginErr">${esc(message || "")}</div>
        <div><button class="primary" type="submit" id="loginBtn">Sign in</button></div>
      </form>
    </div>`;
  el("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const form = new FormData(ev.target);
    el("loginBtn").disabled = true;
    el("loginErr").textContent = "";
    try {
      await api("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: form.get("email"), password: form.get("password") }),
      });
      gate.hidden = true; gate.innerHTML = "";
      boot();
    } catch (err) {
      el("loginErr").textContent =
        err.code === 401 ? "That email and password did not match."
        : err.code === 429 ? "Too many attempts. Wait a few minutes."
        : `Sign-in failed: ${err.message}`;
      el("loginBtn").disabled = false;
    }
  });
}

// --- entry -----------------------------------------------------------------

function render() {
  renderGoalLine();
  renderModeTabs();
  if (state.mode === "days") renderDays();
  else if (state.mode === "rollup") renderRollup();
  else renderSystem();
}

async function boot() {
  loadGoals();
  try {
    state.me = await api("/api/me");
  } catch (err) {
    if (err.code === 401) return showLogin();
    el("main").hidden = false;
    el("systemView").hidden = false;
    return renderSystem();
  }
  el("gate").hidden = true;
  el("main").hidden = false;

  const data = await api(`/api/days?days=${WINDOW_DAYS}`);
  state.days = data.days || [];
  el("foot").textContent = state.days.length
    ? `days shown in ${data.timezone}`
    : "no days recorded yet — log a meal through Claude, or run the Garmin sync";
  render();
}

boot();
</script>
