<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet log</title>
<link rel="stylesheet" href="/static/fonts.css">
<style>
  :root {
    --paper: #F6F1E4;
    --paper-line: #DCD4BC;
    --ink: #2B2A24;
    --ink-soft: #6B6553;
    --tomato: #B5452B;
    --leaf: #4A6B3D;
    --leaf-dark: #33492A;
    --butter: #E3B23C;
    --card: #FFFDF6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image: repeating-linear-gradient(var(--paper-line) 0 1px, transparent 1px 32px);
    color: var(--ink);
    font-family: 'Karla', 'Segoe UI', system-ui, sans-serif;
    padding: 28px 16px 60px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 3px solid var(--ink); padding-bottom: 14px; margin-bottom: 20px;
    gap: 16px; flex-wrap: wrap;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 2rem;
    margin: 0; letter-spacing: -0.01em;
  }

  .goal-line {
    text-align: right; font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.8rem; color: var(--ink-soft); line-height: 1.7;
  }
  .goal-line b { color: var(--ink); font-weight: 600; }
  .goal-line input {
    font: inherit; font-weight: 600; color: var(--ink); width: 5ch;
    background: transparent; border: none; border-bottom: 1px dashed var(--ink-soft);
    text-align: right; padding: 0 2px; appearance: textfield; -moz-appearance: textfield;
  }
  .goal-line input::-webkit-outer-spin-button,
  .goal-line input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .goal-line input:focus { outline: none; border-bottom-style: solid; }
  .who button {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.76rem;
    background: none; border: none; color: var(--tomato); cursor: pointer;
    padding: 0; text-decoration: underline;
  }

  .mode-tabs {
    display: flex; margin-bottom: 16px; border: 1.5px solid var(--ink);
    border-radius: 4px; overflow: hidden; width: fit-content;
  }
  .mode-tab {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.78rem;
    padding: 8px 16px; border: none; background: var(--card); color: var(--ink);
    cursor: pointer; border-right: 1.5px solid var(--ink);
  }
  .mode-tab:last-child { border-right: none; }
  .mode-tab.active { background: var(--leaf-dark); color: var(--card); }

  .summary, .block-card {
    background: var(--card); border: 1.5px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink); padding: 20px 22px; margin-bottom: 18px;
  }

  .summary-top, .block-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 16px; gap: 12px;
  }
  .summary-top h2, .block-title h2 {
    font-family: 'Fraunces', Georgia, serif; font-size: 1.3rem; margin: 0; font-weight: 600;
  }
  .block-title h2 { font-size: 1.15rem; }
  .block-title .sub, .avg-line {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.74rem; color: var(--ink-soft);
  }
  .avg-line { margin-top: 4px; }

  .status-pill {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.72rem;
    padding: 3px 9px; border-radius: 10px; border: 1px solid var(--ink); white-space: nowrap;
  }
  .status-pill.estimated { color: var(--tomato); border-color: var(--tomato); }
  .status-pill.measured  { color: var(--leaf-dark); border-color: var(--leaf-dark); }
  .status-pill.ok    { color: var(--leaf-dark); border-color: var(--leaf-dark); }
  .status-pill.stale { color: var(--butter); border-color: var(--butter); }
  .status-pill.down  { color: var(--tomato); border-color: var(--tomato); }

  .metric { margin-bottom: 14px; }
  .metric-label {
    display: flex; justify-content: space-between;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.82rem; margin-bottom: 6px;
  }
  .metric-label .name { color: var(--ink-soft); }
  .metric-label .value { font-weight: 600; }

  .bar-track {
    height: 12px; background: var(--paper); border: 1px solid var(--ink);
    border-radius: 7px; overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 7px 0 0 7px; transition: width 0.4s ease; }
  .bar-fill.kcal { background: var(--butter); }
  .bar-fill.protein { background: var(--leaf); }
  .bar-fill.over { background: var(--tomato); }

  .balance-line {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.78rem; color: var(--ink-soft);
  }
  .balance-line .value { color: var(--ink); font-weight: 600; }
  .balance-line .deficit { color: var(--leaf-dark); font-weight: 600; }
  .balance-line .surplus { color: var(--tomato); font-weight: 600; }

  .table-wrap { overflow-x: auto; }
  table.days { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  table.days th {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.72rem;
    font-weight: 500; color: var(--ink-soft); text-align: right; white-space: nowrap;
    padding: 0 0 8px 14px; border-bottom: 1.5px solid var(--ink);
  }
  table.days th:first-child, table.days td:first-child { text-align: left; padding-left: 0; }
  table.days td {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.85rem;
    text-align: right; white-space: nowrap; padding: 9px 0 9px 14px;
    border-bottom: 1px dotted var(--paper-line);
  }
  table.days tr:last-child td { border-bottom: none; }
  table.days tbody tr.day-row { cursor: pointer; }
  table.days tbody tr.day-row:hover td { background: var(--paper); }
  table.days tr.today td { font-weight: 600; }
  td.date { font-family: 'Karla', sans-serif; font-size: 0.9rem; }
  td.date::before {
    content: "▸"; color: var(--ink-soft); display: inline-block; width: 1.1em;
    font-size: 0.8em; transition: transform 0.15s ease;
  }
  tr.open td.date::before { transform: rotate(90deg); }
  .est { border-bottom: 1px dotted var(--ink-soft); }
  .partial { border-bottom: 1px dotted var(--butter); }
  .neg { color: var(--leaf-dark); font-weight: 600; }
  .pos { color: var(--tomato); font-weight: 600; }
  .muted { color: var(--ink-soft); }
  tr.detail > td {
    background: var(--paper); padding: 4px 0 12px 14px; border-bottom: 1px dotted var(--paper-line);
  }
  .meal-line {
    display: flex; justify-content: space-between; gap: 12px; padding: 5px 0;
    font-family: 'Karla', sans-serif; font-size: 0.88rem; text-align: left;
  }
  .meal-line .nums {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.78rem;
    color: var(--ink-soft); white-space: nowrap;
  }
  .meal-items {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.72rem;
    color: var(--ink-soft); padding-left: 12px; border-left: 2px solid var(--paper-line);
    margin: 2px 0 6px; text-align: left;
  }

  .empty-note { color: var(--ink-soft); font-size: 0.88rem; font-style: italic; padding: 6px 0; }

  /* system / chain */
  .chain { list-style: none; margin: 0; padding: 0; }
  .chain li {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 10px 0; border-bottom: 1px dotted var(--paper-line);
  }
  .chain li:last-child { border-bottom: none; }
  .chain .stage-name { font-weight: 500; }
  .chain .stage-detail {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.76rem;
    color: var(--ink-soft); display: block; margin-top: 2px;
  }
  .chain .lat { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.74rem; color: var(--ink-soft); }

  /* sign in */
  form.login { display: grid; gap: 0.7rem; max-width: 21rem; }
  label.field { display: grid; gap: 0.2rem; font-family: 'IBM Plex Mono', ui-monospace, monospace;
                font-size: 0.76rem; color: var(--ink-soft); }
  label.field input {
    font-family: 'Karla', sans-serif; font-size: 0.9rem; padding: 9px 10px;
    border: 1.5px solid var(--ink); border-radius: 3px; background: var(--paper); color: var(--ink);
  }
  button.primary {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; font-size: 0.85rem;
    background: var(--leaf-dark); color: var(--card); border: none; border-radius: 3px;
    cursor: pointer; padding: 10px 16px;
  }
  button.primary:hover:not(:disabled) { background: var(--leaf); }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  .err { color: var(--tomato); font-size: 0.82rem; min-height: 1.2em;
         font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .foot-note {
    text-align: center; font-size: 0.74rem; color: var(--ink-soft); margin-top: 26px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
  }

  @media (max-width: 480px) {
    header { align-items: flex-start; }
    .goal-line { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Diet log</h1>
    <div class="goal-line" id="goalLine"></div>
  </header>

  <div id="gate" hidden></div>

  <div id="main" hidden>
    <div class="mode-tabs" id="modeTabs"></div>
    <div id="dayView"></div>
    <div id="rollupView" hidden></div>
    <div id="systemView" hidden></div>
  </div>

  <div class="foot-note" id="foot"></div>
</div>

<script>
"use strict";

// Identity is the session cookie. No endpoint takes a user id.
const GOALS_KEY = "diet-log-goals";
const WINDOW_DAYS = 28;

let state = {
  mode: "days",
  days: [],          // newest first, from /api/days
  expanded: new Set(),   // dates whose meals are shown
  detail: {},        // date -> /api/day payload
  me: null,
  goals: { kcal: 1800, protein: 150 },
};

// --- plumbing --------------------------------------------------------------

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { Accept: "application/json", ...(options.headers || {}) },
  });
  let body = null;
  try { body = await res.json(); } catch (_) {}
  if (!res.ok) {
    throw Object.assign(new Error(body?.error || `${path} returned ${res.status}`),
                        { code: res.status });
  }
  return body;
}

const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n0 = (v) => v == null ? "—" : Math.round(v).toLocaleString();
const n1 = (v) => v == null ? "—" : Number(v).toFixed(1);

function loadGoals() {
  try {
    const raw = localStorage.getItem(GOALS_KEY);
    if (raw) state.goals = { ...state.goals, ...JSON.parse(raw) };
  } catch (_) { /* private mode, or nothing stored */ }
}
function saveGoals() {
  try { localStorage.setItem(GOALS_KEY, JSON.stringify(state.goals)); } catch (_) {}
}

// --- pieces ----------------------------------------------------------------

function bar(label, value, goal, cls, unit) {
  const known = value != null;
  const pct = known && goal > 0 ? Math.min(100, (value / goal) * 100) : 0;
  const over = known && value > goal;
  const shown = unit === "kcal" ? n0(value) : n1(value);
  return `
    <div class="metric">
      <div class="metric-label">
        <span class="name">${esc(label)}</span>
        <span class="value">${shown} / ${unit === "kcal" ? n0(goal) : n1(goal)} ${unit}</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${over ? "over" : cls}" style="width:${pct}%"></div></div>
    </div>`;
}

function balanceLine(intake, expenditure, opts = {}) {
  if (intake == null || expenditure == null) {
    return `<div class="balance-line">energy balance: <span class="value">—</span>
      ${expenditure == null ? "(no expenditure synced for this day)" : "(nothing logged)"}</div>`;
  }
  const diff = intake - expenditure;
  const cls = diff < 0 ? "deficit" : "surplus";
  const word = diff < 0 ? "deficit" : "surplus";
  return `<div class="balance-line">energy balance: intake ${n0(intake)} kcal −
    expenditure ${n0(expenditure)} kcal =
    <span class="${cls}">${diff > 0 ? "+" : ""}${n0(diff)} kcal</span> (${word})
    ${opts.partial ? '<br><span style="opacity:.75">expenditure is active calories only; the whole-day total has not synced</span>' : ""}
    ${opts.note || ""}</div>`;
}

function renderGoalLine() {
  const box = el("goalLine");
  if (!state.me) { box.textContent = ""; return; }
  box.innerHTML = `
    <div class="who">signed in as <b>${esc(state.me.display_name)}</b> ·
      <button id="signOut">sign out</button></div>
    <div>target <input id="goalKcal" type="number" min="0" step="10" value="${state.goals.kcal}"> kcal ·
      <input id="goalProtein" type="number" min="0" step="5" value="${state.goals.protein}"> g protein</div>`;
  el("signOut").onclick = async () => {
    await api("/api/logout", { method: "POST" }).catch(() => {});
    location.reload();
  };
  for (const [id, key] of [["goalKcal", "kcal"], ["goalProtein", "protein"]]) {
    el(id).addEventListener("change", (ev) => {
      const v = parseFloat(ev.target.value);
      if (!isNaN(v) && v >= 0) { state.goals[key] = v; saveGoals(); render(); }
    });
  }
}

function renderModeTabs() {
  const modes = [["days", "Days"], ["rollup", "Summary"], ["system", "System"]];
  el("modeTabs").innerHTML = "";
  for (const [id, label] of modes) {
    const b = document.createElement("button");
    b.className = "mode-tab" + (state.mode === id ? " active" : "");
    b.textContent = label;
    b.onclick = () => { state.mode = id; render(); };
    el("modeTabs").append(b);
  }
  el("dayView").hidden = state.mode !== "days";
  el("rollupView").hidden = state.mode !== "rollup";
  el("systemView").hidden = state.mode !== "system";
}

// The day list: every day in the window on one screen with its own totals,
// which is the view that actually answers "how am I doing". A row expands to
// the meals behind its numbers.
function renderDays() {
  const box = el("dayView");
  if (!state.days.length) {
    box.innerHTML = `<div class="summary"><div class="empty-note">
      No days recorded yet. Log a meal through Claude, or run the Garmin sync,
      and the first row appears here.</div></div>`;
    return;
  }
  const today = state.days[0].date;

  // Any expanded row without its detail yet gets fetched here rather than only
  // in the click handler, so an expanded row can never stick on "Loading…".
  for (const date of state.expanded) {
    if (!state.detail[date]) loadDetail(date);
  }

  const rows = state.days.map((d) => {
    const known = d.energy_in_kcal != null && d.energy_out_kcal != null;
    const bal = known ? d.energy_in_kcal - d.energy_out_kcal : null;
    const inCell = d.energy_in_kcal == null ? '<span class="muted">—</span>'
      : `<span class="${d.intake_source === "claude-estimate" ? "est" : ""}"
           title="${d.intake_source === "claude-estimate" ? "estimated from a description" : "measured"}"
           >${n0(d.energy_in_kcal)}</span>`;
    const outCell = d.energy_out_kcal == null ? '<span class="muted">—</span>'
      : d.energy_out_partial
        ? `<span class="partial" title="active calories only — whole-day total not synced">${n0(d.energy_out_kcal)}</span>`
        : n0(d.energy_out_kcal);
    const dt = new Date(d.date + "T12:00:00");
    const label = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    const open = state.expanded.has(d.date);
    return `
      <tr class="day-row${d.date === today ? " today" : ""}${open ? " open" : ""}" data-date="${d.date}">
        <td class="date">${esc(label)}${d.date === today ? " · today" : ""}</td>
        <td>${inCell}</td>
        <td>${d.protein_g == null ? '<span class="muted">—</span>' : n1(d.protein_g)}</td>
        <td>${outCell}</td>
        <td class="${bal == null ? "muted" : bal < 0 ? "neg" : "pos"}">${
          bal == null ? "—" : (bal > 0 ? "+" : "") + n0(bal)}</td>
        <td>${d.weight_kg == null ? '<span class="muted">—</span>' : n1(d.weight_kg)}</td>
        <td>${d.meals_logged || '<span class="muted">—</span>'}</td>
      </tr>
      ${open ? `<tr class="detail"><td colspan="7">${dayDetailHtml(d.date)}</td></tr>` : ""}`;
  }).join("");

  box.innerHTML = `
    <div class="summary">
      <div class="summary-top">
        <h2>Recent days</h2>
        <span class="block-title"><span class="sub">${state.days.length} days · newest first</span></span>
      </div>
      <div class="table-wrap">
        <table class="days">
          <thead><tr>
            <th>Date</th><th>In</th><th>Protein</th><th>Out</th>
            <th>Balance</th><th>Weight</th><th>Meals</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="avg-line" style="margin-top:14px">
        kcal in / g protein / kcal out / balance / kg. Underlined intake is estimated
        from a description; everything else is measured. Click a day for its meals.
      </div>
    </div>`;

  box.querySelectorAll("tr.day-row").forEach((tr) => {
    tr.addEventListener("click", () => {
      const date = tr.dataset.date;
      if (state.expanded.has(date)) state.expanded.delete(date);
      else { state.expanded.add(date); if (!state.detail[date]) loadDetail(date); }
      renderDays();
    });
  });
}

function dayDetailHtml(date) {
  const detail = state.detail[date];
  if (!detail) return '<div class="empty-note">Loading…</div>';
  if (!detail.meals.length) {
    return `<div class="empty-note">Nothing logged on this day.${
      detail.measurements && detail.measurements.length
        ? ` ${detail.measurements.length} measurement${detail.measurements.length === 1 ? "" : "s"} from Garmin.`
        : ""}</div>`;
  }
  return detail.meals.map((m) => {
    const when = new Date(m.eaten_at).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    const protein = (m.items || []).reduce((a, i) => a + Number(i.protein_g || 0), 0);
    const items = (m.items || []).map((i) =>
      `${esc(i.food)} — ${n0(i.kcal)} kcal${i.grams != null ? `, ${n0(i.grams)} g` : ""}${
        i.protein_g != null ? `, ${n1(i.protein_g)} g protein` : ""}`).join("<br>");
    return `
      <div class="meal-line">
        <span>${esc(m.description)}</span>
        <span class="nums">${when} · ${n0(m.kcal)} kcal · ${n1(protein)} g</span>
      </div>
      <div class="meal-items">${items || "no breakdown recorded"}</div>`;
  }).join("");
}

const inFlight = new Set();

async function loadDetail(date) {
  if (inFlight.has(date)) return;
  inFlight.add(date);
  try {
    state.detail[date] = await api(`/api/day/${date}`);
  } catch (err) {
    state.detail[date] = { meals: [], measurements: [], error: err.message };
  }
  inFlight.delete(date);
  if (state.mode === "days") renderDays();
}

function renderRollup() {
  const box = el("rollupView");
  const recorded = state.days.filter((d) => d.meals_logged > 0 || d.energy_out_kcal != null);
  if (!recorded.length) {
    box.innerHTML = `<div class="block-card"><div class="empty-note">Nothing recorded yet.</div></div>`;
    return;
  }
  const asc = [...recorded].reverse();
  const weeks = [];
  for (let i = 0; i < asc.length; i += 7) weeks.push(asc.slice(i, i + 7));

  const blocks = weeks.map((week, wi) => {
    const st = statsFor(week);
    const weights = week.filter((d) => d.weight_kg != null);
    return `
      <div class="block-card">
        <div class="block-title">
          <h2>Week ${wi + 1}</h2>
          <span class="sub">${week[0].date} – ${week[week.length - 1].date} · ${st.n} day${st.n === 1 ? "" : "s"}</span>
        </div>
        ${statsBlock(st)}
        ${weights.length >= 2 ? `<div class="avg-line" style="margin-top:8px">
          weight ${n1(weights[0].weight_kg)} kg → ${n1(weights[weights.length - 1].weight_kg)} kg</div>` : ""}
      </div>`;
  }).join("");

  const all = statsFor(recorded);
  const withIntake = recorded.filter((d) => d.energy_in_kcal != null);
  const overKcal = withIntake.filter((d) => d.energy_in_kcal > state.goals.kcal).length;
  const hitProtein = withIntake.filter((d) => (d.protein_g || 0) >= state.goals.protein).length;

  box.innerHTML = blocks + `
    <div class="block-card">
      <div class="block-title"><h2>All days</h2>
        <span class="sub">${all.n} recorded · ${all.intakeDays} with meals</span></div>
      ${all.intakeDays ? `
        ${bar("daily average calories", all.kcal / all.intakeDays, state.goals.kcal, "kcal", "kcal")}
        ${bar("daily average protein", all.protein / all.intakeDays, state.goals.protein, "protein", "g")}
        <div class="avg-line" style="margin-top:12px">
          calorie target exceeded on ${overKcal} of ${all.intakeDays} logged days ·
          protein target met on ${hitProtein} of ${all.intakeDays}
        </div>`
      : '<div class="empty-note">No meals logged yet.</div>'}
    </div>`;
}

async function renderSystem() {
  const box = el("systemView");
  box.innerHTML = `<div class="block-card"><div class="empty-note">Checking…</div></div>`;
  const t0 = performance.now();
  try {
    const data = await api("/api/status");
    box.innerHTML = `
      <div class="block-card">
        <div class="block-title">
          <h2>Where the data comes from</h2>
          <span class="sub">round trip ${Math.round(performance.now() - t0)} ms</span>
        </div>
        <ul class="chain">
          ${data.stages.map((s) => `
            <li>
              <span>
                <span class="stage-name">${esc(s.stage)}</span>
                <span class="stage-detail">${esc(s.detail)}</span>
              </span>
              <span style="text-align:right;white-space:nowrap">
                <span class="status-pill ${esc(s.state)}">${esc(s.state)}</span>
                ${s.ms == null ? "" : `<div class="lat">${s.ms} ms</div>`}
              </span>
            </li>`).join("")}
        </ul>
      </div>`;
  } catch (err) {
    box.innerHTML = `<div class="block-card">
      <div class="block-title"><h2>The API did not answer</h2></div>
      <div class="empty-note">${esc(err.message)}. The page is being served, so check that
      the app container is running and that nginx proxies to it.</div></div>`;
  }
}

// --- sign in ---------------------------------------------------------------

function showLogin(message) {
  el("main").hidden = true;
  el("goalLine").textContent = "";
  const gate = el("gate");
  gate.hidden = false;
  gate.innerHTML = `
    <div class="summary" style="max-width:26rem">
      <div class="summary-top"><h2>Sign in</h2></div>
      <form class="login" id="loginForm">
        <label class="field">email<input type="email" name="email" autocomplete="username" required></label>
        <label class="field">password<input type="password" name="password" autocomplete="current-password" required></label>
        <div class="err" id="loginErr">${esc(message || "")}</div>
        <div><button class="primary" type="submit" id="loginBtn">Sign in</button></div>
      </form>
    </div>`;
  el("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const form = new FormData(ev.target);
    el("loginBtn").disabled = true;
    el("loginErr").textContent = "";
    try {
      await api("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: form.get("email"), password: form.get("password") }),
      });
      gate.hidden = true; gate.innerHTML = "";
      boot();
    } catch (err) {
      el("loginErr").textContent =
        err.code === 401 ? "That email and password did not match."
        : err.code === 429 ? "Too many attempts. Wait a few minutes."
        : `Sign-in failed: ${err.message}`;
      el("loginBtn").disabled = false;
    }
  });
}

// --- entry -----------------------------------------------------------------

function render() {
  renderGoalLine();
  renderModeTabs();
  if (state.mode === "days") renderDays();
  else if (state.mode === "rollup") renderRollup();
  else renderSystem();
}

async function boot() {
  loadGoals();
  try {
    state.me = await api("/api/me");
  } catch (err) {
    if (err.code === 401) return showLogin();
    el("main").hidden = false;
    el("systemView").hidden = false;
    return renderSystem();
  }
  el("gate").hidden = true;
  el("main").hidden = false;

  const data = await api(`/api/days?days=${WINDOW_DAYS}`);
  state.days = data.days || [];
  el("foot").textContent = state.days.length
    ? `days shown in ${data.timezone}`
    : "no days recorded yet — log a meal through Claude, or run the Garmin sync";
  render();
}

boot();
</script>
</body>
</html>
