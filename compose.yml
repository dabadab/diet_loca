# Whole backend: `docker compose up -d --build`
#
# The app applies its own schema at startup (advisory-locked, idempotent), so
# there is no separate migration step and no dependency on the Postgres image's
# one-shot initdb hooks -- redeploying onto an existing volume works.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # This is the *owner/migration* role. The app itself never connects as it.
      POSTGRES_USER: ${POSTGRES_USER:-diet_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-diet}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diet_owner} -d ${POSTGRES_DB:-diet}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Deliberately not published. Reach it with `docker compose exec db psql`.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Runtime connection: unprivileged role, subject to row-level security.
      DATABASE_URL: postgresql://${APP_DB_USER:-diet_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-diet}
      # Migration connection: owner role, used only during startup.
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-diet_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-diet}
      # Third connection: the read-only role, used only by the MCP query_sql
      # tool. Left unset if READONLY_DB_PASSWORD is empty, which simply hides
      # that one tool.
      READONLY_DATABASE_URL: ${READONLY_DB_PASSWORD:+postgresql://diet_ro:${READONLY_DB_PASSWORD}@db:5432/${POSTGRES_DB:-diet}}
      # Passwords the migration hands to CREATE/ALTER ROLE, so the roles in the
      # database always match what .env says.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-}
      MCP_ENABLED: ${MCP_ENABLED:-1}
      # Empty means: on when MCP_PUBLIC_URL is set, off otherwise.
      OAUTH_ENABLED: ${OAUTH_ENABLED:-}
      OAUTH_ACCESS_TTL_MINUTES: ${OAUTH_ACCESS_TTL_MINUTES:-60}
      OAUTH_REFRESH_TTL_DAYS: ${OAUTH_REFRESH_TTL_DAYS:-30}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      # Leave at 1 behind TLS. Set to 0 only to test over plain http.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      TZ: ${TZ:-UTC}
    volumes:
      # The encryption key lives outside the database on purpose: a dump of
      # diet.garmin_credentials is then not a set of Garmin sessions.
      # The directory is mounted, not the file: Docker materialises a missing
      # bind-mount source as a directory, and pointing that at the key path
      # produces "Is a directory" at exactly the moment you try to create it.
      - ./secrets:/run/secrets:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:8080"

  # Sidecar: polls on an interval alongside the app. A one-shot run for
  # backfills or debugging still works:
  #   docker compose run --rm poller --days 30 --user you@example.com
  poller:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-diet_app}:${APP_DB_PASSWORD:?}@db:5432/${POSTGRES_DB:-diet}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-diet_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-diet}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      GARMIN_POLL_DAYS: ${GARMIN_POLL_DAYS:-3}
      GARMIN_POLL_LOOP: "1"
      GARMIN_POLL_INTERVAL: ${GARMIN_POLL_INTERVAL:-3600}
      GARMIN_RAW_DIR: /var/log/diet/garmin
      TZ: ${TZ:-UTC}
    volumes:
      - ./secrets:/run/secrets:ro
      - garminraw:/var/log/diet/garmin
    # entrypoint rather than command, so `docker compose run --rm poller --once
    # --days 30` appends flags instead of replacing the whole command line.
    entrypoint: ["python", "-m", "app.poller"]
    command: []
    # A sidecar has no exit code for anyone to read, so failure surfaces here
    # instead: a cycle that failed, or no successful cycle in three intervals,
    # makes the container unhealthy and visible to `docker compose ps`.
    healthcheck:
      test: ["CMD", "python", "-m", "app.poller", "--healthcheck"]
      interval: 120s
      timeout: 10s
      retries: 2
      start_period: 120s

volumes:
  pgdata:
  garminraw:
